<!DOCTYPE HTML>
<html>
<head>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<title>Space Invaders x Aquatic Pests</title>
    <meta name="theme-color" content="#03001d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Didymo Invaders">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" type="text/css" href="src/style.css?v=3">
    <script src="assets/libs/phaser.js?v=3"></script>
    <script src="src/Boot.js?v=3"></script>
    <script src="src/Preloader.js?v=3"></script>
    <script src="src/StartMenu.js?v=3"></script>
    <script src="src/Game.js?v=3"></script>
    <script src="src/GameLevel2.js?v=3"></script>
    <script src="src/GameLevel3.js?v=3"></script>
    <script src="src/FactCards.js?v=3"></script>
    <script src="src/EndScene.js?v=3"></script>

</head>
<body>
    <div id="gameContainer"></div>
    <script type="text/javascript">
        window.onload = function() {
            var game = new Phaser.Game(540, 960, Phaser.AUTO, 'gameContainer');
            game.state.add('Boot', SpaceInvaders.Boot);
            game.state.add('Preloader', SpaceInvaders.Preloader);
            game.state.add('StartMenu', SpaceInvaders.StartMenu);
            game.state.add('Game', SpaceInvaders.Game);
            game.state.add('GameLevel2', SpaceInvaders.GameLevel2);
            game.state.add('GameLevel3', SpaceInvaders.GameLevel3);
            game.state.add('FactCard1', SpaceInvaders.FactCard1);
            game.state.add('FactCard2', SpaceInvaders.FactCard2);
            game.state.add('FactCard3', SpaceInvaders.FactCard3);
            game.state.add('EndScene', SpaceInvaders.EndScene);
            game.state.start('Boot');
            
        }
    </script>
</body>
</html>
